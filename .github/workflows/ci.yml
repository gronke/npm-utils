name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt · clippy · test (${{ matrix.name }})
    runs-on: ${{ vars.RUNNER_STANDARD || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The full feature set, including the `cli` bins — and the single leg that runs fmt.
          - name: all-features
            features: "--all-features"
            fmt: "true"
          # The default library build (no `cli`, so no clap) — keeps the always-on modules
          # (`audit`, `sbom`, …) honest without the CLI's optional dependency.
          - name: default
            features: ""
            fmt: "false"
    steps:
      - uses: actions/checkout@v7

      # Reusable Rust CI actions from gronke/rust-ci, pinned to a release tag.
      - uses: gronke/rust-ci/.github/actions/install-toolchain@v1.1.0
        with:
          toolchain: stable
          components: rustfmt clippy

      - uses: gronke/rust-ci/.github/actions/rust-cache@v1.1.0
        with:
          prefix: ${{ matrix.name }}

      # fmt (once) + clippy (`--workspace --all-targets -D warnings`) + test (`--workspace`) for this
      # feature universe.
      - uses: gronke/rust-ci/.github/actions/lint-and-test@v1.1.0
        with:
          features: ${{ matrix.features }}
          fmt: ${{ matrix.fmt }}

      # The package.json / package-lock.json schemas live in the `package_json` module; run their
      # strict spec-conformance suite as a named gate too (a labeled subset of the full test run).
      - name: Spec tests (package_json)
        if: matrix.name == 'all-features'
        run: "cargo test -p npm-utils package_json::"

  changelog:
    name: changelog check
    runs-on: ${{ vars.RUNNER_STANDARD || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The check derives its version baseline from the greatest vX.Y.Z tag.
          fetch-depth: 0

      # cargo metadata resolves the crate version; the toolchain is the runner's default.
      - uses: gronke/rust-ci/.github/actions/install-toolchain@v1.1.0
        with:
          toolchain: stable

      # Entries under [Unreleased] require the crate version to exceed the last
      # release; a **Breaking:** entry requires more than a patch bump.
      - uses: gronke/rust-ci/.github/actions/changelog@v1.1.0
        with:
          mode: check
          package: npm-utils

  msrv:
    name: build on MSRV (1.88)
    runs-on: ${{ vars.RUNNER_STANDARD || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      # The crate advertises rust-version = 1.88; build the published crate on exactly that
      # toolchain so a dependency quietly raising its MSRV can't drift past us unnoticed.
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal

      - name: Build on MSRV
        run: cargo +1.88 build -p npm-utils --all-features

  # The port against the world: npm 12.1.0 (the version tests/fixtures/pack/npm.json pins)
  # and minimatch 10.2.5 answer live through ci/sealed-node, a digest-pinned node container
  # without network, so the recorders, the generated differential and the real-package corpora
  # (tests/pack_e2e.rs) run here on every pull request, and the committed records must
  # reproduce; the minimatch tree itself is installed by this crate's `ci` verb.
  pack-e2e:
    name: pack · real packages against npm 12.1.0
    runs-on: ${{ vars.RUNNER_STANDARD || 'ubuntu-latest' }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      NODE_IMAGE: node:24-slim@sha256:3638d9a6fe4030bd716be989438248074489337ba3275657f93595428be4fc03
      NPM_VERSION: 12.1.0
      NPM_INTEGRITY: sha512-Fyhu62pNx70YCs/5+dEmJQTFVmSKwvo5CA0qvBkGDRpob42MJ6G2RQ2tdxeKM4nYnIZDqkYAxEgqtoejn9QGtQ==
    steps:
      - uses: actions/checkout@v7

      - uses: gronke/rust-ci/.github/actions/install-toolchain@v1.1.0
        with:
          toolchain: stable

      - uses: gronke/rust-ci/.github/actions/rust-cache@v1.1.0
        with:
          prefix: pack-e2e

      # The image bundles npm 11; the pinned npm rides in as an integrity-checked tarball and
      # runs from its own tree (it bundles its dependencies).
      - name: npm ${{ env.NPM_VERSION }}, integrity-checked
        run: |
          set -euo pipefail
          curl -fsSL "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz" -o "$RUNNER_TEMP/npm.tgz"
          got="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/npm.tgz" | base64 -w0)"
          [ "$got" = "$NPM_INTEGRITY" ] || { echo "::error::npm tarball integrity mismatch: $got"; exit 1; }
          mkdir -p "$RUNNER_TEMP/npm" && tar -xzf "$RUNNER_TEMP/npm.tgz" -C "$RUNNER_TEMP/npm" --strip-components=1
          echo "SEALED_NPM=$RUNNER_TEMP/npm" >> "$GITHUB_ENV"

      # The minimatch the live matcher tests compare against, installed from the committed
      # lockfile by this crate's own `ci` verb: lockfile v3, every tarball sha512-checked, no
      # scripts. No container run needs the network after this.
      - name: minimatch 10.2.5 from the lockfile, through npm-utils ci
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sealed-node"
          cp ci/sealed-node/package.json ci/sealed-node/package-lock.json "$RUNNER_TEMP/sealed-node/"
          cargo run --features cli --bin npm-utils -- ci "$RUNNER_TEMP/sealed-node"
          echo "SEALED_NODE_MODULES=$RUNNER_TEMP/sealed-node/node_modules" >> "$GITHUB_ENV"
          echo "MINIMATCH_NODE_PATH=$RUNNER_TEMP/sealed-node/node_modules" >> "$GITHUB_ENV"
          echo "$PWD/ci/sealed-node/bin" >> "$GITHUB_PATH"

      - name: The live tests and the real-package corpora
        run: cargo test --features cli --bin npm-utils --test pack_npm --test cli --test minimatch --test pack_e2e -- --ignored --test-threads=1

      # The recorders rewrote the records from npm 12.1.0 and minimatch 10.2.5; the committed
      # ones must come back unchanged.
      - name: The pinned records reproduce
        run: git diff --exit-code -- tests/fixtures

  package:
    name: publish dry-run
    runs-on: ${{ vars.RUNNER_STANDARD || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: gronke/rust-ci/.github/actions/install-toolchain@v1.1.0
        with:
          toolchain: stable

      - uses: gronke/rust-ci/.github/actions/rust-cache@v1.1.0
        with:
          prefix: package

      # Validate the exact artifact crates.io would receive — include rules, package metadata, and
      # that the packaged crate builds — across all features. No `--locked`: this is a library with
      # no committed Cargo.lock.
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --all-features
