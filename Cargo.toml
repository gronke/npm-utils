[package]
name = "npm-utils"
version = "0.7.0"
authors = ["Stefan Grönke <stefan@gronke.net>"]
homepage = "https://github.com/gronke/npm-utils"
repository = "https://github.com/gronke/npm-utils"
description = "Pure-Rust npm toolkit: resolve, download, install/ci, add/remove/upgrade, search, SBOM (CycloneDX/SPDX), and vulnerability audit (npm + OSV) — no Node."
categories = ["development-tools", "command-line-utilities", "web-programming"]
keywords = ["npm", "registry", "audit", "sbom", "lockfile"]
license = "MIT"
edition = "2021"
rust-version = "1.88"   # floor set by the `time` dependency (MSRV 1.88); guarded by the CI msrv job
include = ["src/**/*.rs", "Cargo.toml", "/README.md", "LICENSE", "/LICENSES/**", "/REUSE.toml"]

# docs.rs builds with the default features unless told otherwise; the `github` API is part of the
# documented surface, and `--cfg docsrs` marks it as gated.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The `npm-utils` / `cargo-npm-utils` command-line tool (pure-Rust `npm install` / `ci` / `add` /
# `init` / `upgrade`). Opt-in so library consumers never pull `clap`: install the CLI with
# `cargo install npm-utils --features cli`.
cli = ["dep:clap", "dep:indicatif", "github"]
# A GitHub token from `GH_TOKEN`, else `GITHUB_TOKEN`, sent to `api.github.com`, and the second attempt
# through the GitHub API for a `github.com` browser URL of a private release asset or archive that
# answers 404. Off by default, so a library build never picks up a token from its environment by
# accident; the CLI reads it the way `gh` does.
github = ["dep:percent-encoding"]

[dependencies]
# 3.4.2 is the version the download chain's agent configuration was verified against:
# `max_redirects(0)` and `http_status_as_error(false)` at agent level, so the cached TLS config
# is reused across hops. Its MSRV is 1.85, under the crate's 1.88.
ureq = { version = "3.4.2", features = ["rustls", "platform-verifier"], default-features = false }
# Decodes the tag and file segments of a GitHub browser URL (`github` feature); already in the
# tree through ureq.
percent-encoding = { version = "2.3", optional = true }
flate2 = "1.1"
tar = "0.4"
zip = { version = "7", default-features = false, features = ["deflate", "time"] }
# `preserve_order` keeps JSON object keys in insertion order, so the manifest/lockfile writers
# (`package_json::manifest`, `package_json::lock::render_v3`) emit npm-faithful, stable key order
# rather than alphabetized — and editing a `package.json` keeps the user's field order intact.
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
# Verify each downloaded tarball's `sha512-<base64>` integrity — the registry's `dist.integrity`
# (`install::node_modules`) and the hash pinned in a package-lock.json (`install::from_lockfile`).
# npm-install / npm-ci-faithful. Small, widely-trusted crates, well within the crate MSRV.
sha2 = "0.10"
base64 = "0.22"
# Format the SBOM generation timestamp as RFC 3339 (`sbom::now_rfc3339`). `time` is already in the
# tree (via `zip`); this only adds its `formatting` feature — no new dependency.
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }

# CLI only (feature `cli`); optional, so a default library build skips it. clap and its deps build
# under the crate MSRV (1.88), which is set by `time`, not clap.
clap = { version = "4.5", features = ["derive"], optional = true }
# Live multi-task progress rendering for the CLI's `--progress` (`cli::progress`). Optional and
# cli-gated so library builds stay terminal-crate-free; `unicode-width` keeps column accounting
# correct for wide characters. MSRV 1.85, under the crate's 1.88.
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"], optional = true }

# The CLI ships as two binaries from this one crate: `npm-utils <verb>` and, via cargo's
# `cargo-<name>` convention, `cargo npm-utils <verb>`. `cargo install npm-utils --features cli`
# installs both. Each requires the `cli` feature, so a default `cargo build` skips them.
[[bin]]
name = "npm-utils"
path = "src/bin/npm-utils.rs"
required-features = ["cli"]

[[bin]]
name = "cargo-npm-utils"
path = "src/bin/cargo-npm-utils.rs"
required-features = ["cli"]

[dev-dependencies]
tempfile = "3"
# `InMemoryTerm` render assertions for `cli::progress` unit tests. A dev-dep builds only for test
# targets, so the vt100 parser it pulls never reaches release or MSRV builds.
indicatif = { version = "0.18.6", features = ["in_memory", "unicode-width"] }

[workspace]
members = ["examples/date-converter"]
